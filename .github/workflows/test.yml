name: test

on:
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect ai/src changes
    runs-on: ubuntu-latest
    outputs:
      src: ${{ steps.diff.outputs.src }}

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check for changes in ai/src
        id: diff
        run: |
          if git diff --quiet "origin/${GITHUB_BASE_REF}...HEAD" -- ai/src; then
            echo "src=false" >> "$GITHUB_OUTPUT"
          else
            echo "src=true" >> "$GITHUB_OUTPUT"
          fi

  test:
    name: Tests
    needs: changes
    if: needs.changes.outputs.src == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: micromamba-shell {0}
        working-directory: ai

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up conda environment
        uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39 # v3.2.1
        with:
          environment-file: ai/environment.yml
          cache-environment: true
          init-shell: none

      - name: Diagnose environment before pytest (temporary)
        shell: bash --noprofile --norc -eo pipefail {0}
        env:
          BASH_ENV: /dev/null
          PYTHONUNBUFFERED: "1"
          PYTHONFAULTHANDLER: "1"
        run: |
          failed=0
          probe() {
            printf '\n>>>'
            printf ' %q' "$@"
            printf '\n'
            local status=0
            "$@" || status=$?
            printf 'Exit code: %s\n' "$status"
            if [ "$status" -ne 0 ]; then
              failed=1
            fi
          }

          probe pwd
          probe "$MAMBA_EXE" --version
          probe "$MAMBA_EXE" env list

          env_python="${MAMBA_ROOT_PREFIX}/envs/CHM4930/bin/python"
          printf '\nEnvironment Python: %s\n' "$env_python"
          probe test -f "$env_python"
          probe test -x "$env_python"
          probe "$env_python" --version
          probe "$env_python" -c 'import sys; print("Direct Python execution:", sys.executable)'
          probe "$env_python" -c 'import pytest; print("pytest:", pytest.__file__)'
          probe "$env_python" -c 'import pytest_cov; print("pytest-cov:", pytest_cov.__file__)'
          probe "$env_python" -c 'import transformers; print("transformers:", transformers.__file__)'
          probe "$env_python" -m pytest --version

          # Compare direct execution with Micromamba's execution path.
          probe "$MAMBA_EXE" run -r "$MAMBA_ROOT_PREFIX" -n CHM4930 "$env_python" -m pytest --version
          printf '\nDiagnostic failure flag: %s\n' "$failed"
          exit "$failed"

      - name: Run tests with coverage
        run: pytest --cov=src --cov-report=xml --cov-report=term-missing

      - name: Check coverage of changed lines (>= 60%)
        run: |
          diff-cover coverage.xml \
            --compare-branch="origin/${GITHUB_BASE_REF}" \
            --fail-under=60 \
            --markdown-report "$GITHUB_STEP_SUMMARY"
